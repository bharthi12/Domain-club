{% load static %}
<header class="site-nav">
  <nav class="nav-inner" aria-label="Main navigation">
    <a class="nav-brand-wrap" href="{% url 'core:home' %}" aria-label="DBIT Domain Math Club home" style="display: flex; align-items: center; gap: 0.6rem; text-decoration: none; flex-shrink: 0;">
      <img src="{% static 'images/domain_logo.png' %}" alt="Domain Math Club Logo" class="nav-logo-img" width="40" height="40" style="width: 40px; height: 40px; max-width: 40px; max-height: 40px; object-fit: contain; border-radius: 50%; border: 2px solid #1c150c; background: #ffffff; flex-shrink: 0; box-shadow: 2px 2px 0 rgba(0,0,0,0.15);">
